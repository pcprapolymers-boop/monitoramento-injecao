<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Teste de Câmera</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    video {
      width: 100%;
      border-radius: 16px;
      background: #000;
      margin-top: 20px;
    }

    button {
      width: 100%;
      min-height: 60px;
      border: 0;
      border-radius: 14px;
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
      background: #1769aa;
      color: white;
    }

    #status {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: white;
      text-align: center;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>
    🎥 Teste de Câmera
  </h1>

  <button
    onclick="abrirCamera()"
  >
    Abrir câmera
  </button>

  <video
    id="video"
    autoplay
    muted
    playsinline
  ></video>

  <div id="status">
    Aguardando...
  </div>

</div>


<script>

async function abrirCamera() {

  const status =
    document.getElementById('status');

  try {

    status.textContent =
      'Solicitando permissão da câmera...';

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: 'environment'
          }
        },

        audio: false

      });

    const video =
      document.getElementById('video');

    video.srcObject =
      stream;

    status.textContent =
      '✅ Câmera funcionando!';

  }

  catch (erro) {

    console.error(erro);

    status.textContent =
      '❌ Não foi possível acessar a câmera: ' +
      erro.message;

  }

}

</script>

</body>

</html>
