<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Teste de Upload</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      padding: 15px;

      font-family:
        Arial,
        sans-serif;

      background:
        #f2f4f7;

      color:
        #17202a;
    }


    .container {

      max-width:
        650px;

      margin:
        auto;
    }


    .card {

      background:
        white;

      padding:
        18px;

      border-radius:
        18px;

      margin-bottom:
        15px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,.08);
    }


    h1,
    h2 {

      text-align:
        center;
    }


    video {

      width:
        100%;

      display:
        block;

      background:
        #000;

      border-radius:
        15px;
    }


    .camera {

      aspect-ratio:
        4 / 3;

      object-fit:
        cover;
    }


    button {

      width:
        100%;

      min-height:
        60px;

      border:
        none;

      border-radius:
        14px;

      margin-top:
        12px;

      font-size:
        20px;

      font-weight:
        bold;
    }


    .primary {

      background:
        #1769aa;

      color:
        white;
    }


    .record {

      background:
        #d64545;

      color:
        white;
    }


    .upload {

      background:
        #1f9d55;

      color:
        white;
    }


    button:disabled {

      background:
        #aeb7c2;
    }


    #status {

      margin-top:
        15px;

      padding:
        15px;

      border-radius:
        12px;

      background:
        #eef1f5;

      text-align:
        center;

      font-size:
        18px;

      font-weight:
        bold;
    }


    #timer {

      text-align:
        center;

      font-size:
        48px;

      font-weight:
        bold;

      margin:
        15px 0;
    }


    .hidden {

      display:
        none;
    }


    .success {

      background:
        #e8f7ee !important;

      color:
        #176b3a;
    }


    .error {

      background:
        #fdeaea !important;

      color:
        #9e2a2a;
    }

  </style>

</head>


<body>


<div class="container">


  <div class="card">

    <h1>
      🎥 Teste de Upload
    </h1>


    <div id="status">
      Aguardando...
    </div>


    <div id="timer">
      15
    </div>


    <video
      id="camera"
      class="camera"
      autoplay
      muted
      playsinline
    ></video>


    <button
      id="btnCamera"
      class="primary"
      onclick="abrirCamera()"
    >
      📷 Abrir câmera
    </button>


    <button
      id="btnGravar"
      class="record hidden"
      onclick="iniciarGravacao()"
    >
      🔴 Iniciar gravação
    </button>

  </div>


  <div
    id="resultado"
    class="card hidden"
  >

    <h2>
      ✅ Vídeo gravado
    </h2>


    <video
      id="videoGravado"
      controls
      playsinline
    ></video>


    <button
      id="btnEnviar"
      class="upload"
      onclick="enviarVideo()"
    >
      ☁️ Enviar para Google Drive
    </button>

  </div>


</div>


<!--
  Formulário invisível.
  Ele será enviado para o Apps Script
  sem depender de CORS.
-->

<iframe
  name="iframeUpload"
  id="iframeUpload"
  style="
    display:none;
    width:0;
    height:0;
    border:0;
  "
></iframe>


<form
  id="uploadForm"
  target="iframeUpload"
  method="POST"
  enctype="application/x-www-form-urlencoded"
  style="display:none;"
>

  <input
    type="hidden"
    name="tipo"
    id="campoTipo"
  >

  <input
    type="hidden"
    name="nomeArquivo"
    id="campoNome"
  >

  <input
    type="hidden"
    name="mimeType"
    id="campoMime"
  >

  <input
    type="hidden"
    name="arquivoBase64"
    id="campoBase64"
  >

</form>


<script>


/*
 * COLE A URL DO SEU WEB APP AQUI.
 *
 * NÃO COLOQUE ?m=M1
 */

const URL_APPS_SCRIPT =
  'https://script.google.com/macros/s/AKfycbyyczQIADys9S5tG7G9WiR_tFiWubW4mcteLurFO_GOlrlSs9f9CWkcojnjsuG5Jgvt/exec';


let cameraStream =
  null;


let mediaRecorder =
  null;


let partesVideo =
  [];


let videoBlob =
  null;


let contador =
  null;


let segundos =
  15;


/* -------------------------------- */
/* CÂMERA                           */
/* -------------------------------- */


async function abrirCamera() {

  alterarStatus(
    'Solicitando acesso à câmera...'
  );


  try {

    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal:
                'environment'
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio:
            false

        });


    const camera =
      document
        .getElementById(
          'camera'
        );


    camera.srcObject =
      cameraStream;


    await camera.play();


    alterarStatus(
      '✅ Câmera pronta.'
    );


    document
      .getElementById(
        'btnCamera'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'btnGravar'
      )
      .classList
      .remove(
        'hidden'
      );

  }


  catch (erro) {

    console.error(
      erro
    );


    alterarStatus(
      '❌ Erro ao acessar a câmera: ' +
      erro.message,
      true
    );

  }

}


/* -------------------------------- */
/* FORMATO DO VÍDEO                 */
/* -------------------------------- */


function escolherFormato() {

  const formatos = [

    'video/webm;codecs=vp8',

    'video/webm',

    'video/mp4'

  ];


  for (
    const formato
    of formatos
  ) {

    if (
      MediaRecorder
        .isTypeSupported(
          formato
        )
    ) {

      return formato;

    }

  }


  return '';

}


/* -------------------------------- */
/* GRAVAÇÃO                         */
/* -------------------------------- */


function iniciarGravacao() {

  partesVideo =
    [];

  videoBlob =
    null;

  segundos =
    15;


  const formato =
    escolherFormato();


  if (formato) {

    mediaRecorder =
      new MediaRecorder(
        cameraStream,
        {
          mimeType:
            formato
        }
      );

  }

  else {

    mediaRecorder =
      new MediaRecorder(
        cameraStream
      );

  }


  mediaRecorder
    .ondataavailable =
    function(evento) {

      if (
        evento.data &&
        evento.data.size >
        0
      ) {

        partesVideo.push(
          evento.data
        );

      }

    };


  mediaRecorder
    .onstop =
    function() {

      const mime =
        mediaRecorder.mimeType ||
        'video/webm';


      videoBlob =
        new Blob(
          partesVideo,
          {
            type:
              mime
          }
        );


      const url =
        URL.createObjectURL(
          videoBlob
        );


      document
        .getElementById(
          'videoGravado'
        )
        .src =
        url;


      document
        .getElementById(
          'resultado'
        )
        .classList
        .remove(
          'hidden'
        );


      alterarStatus(
        '✅ Vídeo pronto para envio.'
      );


      desligarCamera();

    };


  mediaRecorder.start(
    250
  );


  alterarStatus(
    '🔴 GRAVANDO'
  );


  document
    .getElementById(
      'status'
    )
    .classList
    .remove(
      'success'
    );


  atualizarTimer();


  contador =
    setInterval(
      function() {

        segundos--;

        atualizarTimer();


        if (
          segundos <=
          0
        ) {

          clearInterval(
            contador
          );

          contador =
            null;


          pararGravacao();

        }

      },
      1000
    );

}


/* -------------------------------- */
/* TIMER                            */
/* -------------------------------- */


function atualizarTimer() {

  document
    .getElementById(
      'timer'
    )
    .textContent =
    String(
      segundos
    ).padStart(
      2,
      '0'
    );

}


/* -------------------------------- */
/* PARAR                            */
/* -------------------------------- */


function pararGravacao() {

  if (
    mediaRecorder &&
    mediaRecorder.state !==
    'inactive'
  ) {

    mediaRecorder.stop();

  }

}


/* -------------------------------- */
/* DESLIGAR CÂMERA                  */
/* -------------------------------- */


function desligarCamera() {

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  cameraStream =
    null;

}


/* -------------------------------- */
/* STATUS                           */
/* -------------------------------- */


function alterarStatus(
  texto,
  erro = false
) {

  const status =
    document
      .getElementById(
        'status'
      );


  status.textContent =
    texto;


  status.classList
    .toggle(
      'error',
      erro
    );


  status.classList
    .toggle(
      'success',
      !erro &&
      texto.includes('✅')
    );

}


/* -------------------------------- */
/* CONVERTER BLOB → BASE64          */
/* -------------------------------- */


function blobParaBase64(
  blob
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const reader =
        new FileReader();


      reader.onloadend =
        function() {

          resolve(
            reader.result
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }
  );

}


/* -------------------------------- */
/* ENVIAR VÍDEO                     */
/* -------------------------------- */


async function enviarVideo() {

  if (
    !videoBlob
  ) {

    alterarStatus(
      'Nenhum vídeo disponível para envio.',
      true
    );

    return;

  }


  if (
    !URL_APPS_SCRIPT ||
    URL_APPS_SCRIPT.includes(
      'COLE_AQUI'
    )
  ) {

    alterarStatus(
      'A URL do Apps Script ainda não foi configurada.',
      true
    );

    return;

  }


  const botao =
    document
      .getElementById(
        'btnEnviar'
      );


  botao.disabled =
    true;


  botao.textContent =
    'Preparando envio...';


  try {

    const base64 =
      await blobParaBase64(
        videoBlob
      );


    const mime =
      videoBlob.type ||
      'video/webm';


    const extensao =
      mime.includes('mp4')
        ? 'mp4'
        : 'webm';


    const nome =
      'inspecao_' +
      Date.now() +
      '.' +
      extensao;


    document
      .getElementById(
        'campoTipo'
      )
      .value =
      'VIDEO';


    document
      .getElementById(
        'campoNome'
      )
      .value =
      nome;


    document
      .getElementById(
        'campoMime'
      )
      .value =
      mime;


    document
      .getElementById(
        'campoBase64'
      )
      .value =
      base64;


    alterarStatus(
      '☁️ Enviando vídeo para o Google Drive...'
    );


    botao.textContent =
      'Enviando...';


    /*
     * O formulário é enviado para o Apps Script.
     * Isso evita o problema de CORS.
     */

    const formulario =
      document
        .getElementById(
          'uploadForm'
        );


    formulario.action =
      URL_APPS_SCRIPT;


    formulario.submit();

  }


  catch (erro) {

    console.error(
      erro
    );


    botao.disabled =
      false;


    botao.textContent =
      '☁️ Enviar para Google Drive';


    alterarStatus(
      '❌ Erro ao preparar o vídeo.',
      true
    );

  }

}


/* -------------------------------- */
/* RESPOSTA DO APPS SCRIPT          */
/* -------------------------------- */


window.addEventListener(
  'message',
  function(evento) {

    const dados =
      evento.data;


    if (
      !dados ||
      dados.tipo !==
      'VIDEO'
    ) {

      return;

    }


    const botao =
      document
        .getElementById(
          'btnEnviar'
        );


    if (
      dados.sucesso
    ) {

      botao.disabled =
        false;


      botao.textContent =
        '✅ Vídeo enviado';


      alterarStatus(
        '✅ Vídeo salvo no Google Drive!'
      );


      console.log(
        'Arquivo:',
        dados.nomeArquivo
      );


      console.log(
        'URL:',
        dados.url
      );

    }

    else {

      botao.disabled =
        false;


      botao.textContent =
        '☁️ Enviar para Google Drive';


      alterarStatus(
        '❌ Erro ao salvar vídeo: ' +
        dados.erro,
        true
      );

    }

  }
);

</script>

</body>

</html>
